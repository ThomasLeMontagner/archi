name: Test and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build && npm test
        working-directory: ui
      - name: Verify checked-in browser assets
        run: git diff --exit-code -- src/archi/static
      - run: python -m unittest discover -v
        env:
          PYTHONPATH: src
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run test:browser
        working-directory: ui
      - run: python -m pip install build
      - run: python -m build
      - run: python tests/package_smoke.py dist/archi_explorer-0.2.0-py3-none-any.whl
      - name: Install wheel for browser smoke
        run: python -m pip install --no-deps --force-reinstall dist/archi_explorer-0.2.0-py3-none-any.whl
      - name: Exercise installed browser assets without Node in the server PATH
        run: ARCHI_TEST_CLI="$(command -v archi)" npm run test:browser -- --grep 'aggregate arrow|desktop and narrow|external requests'
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.python }}
          path: |
            dist/
            .artifacts/
            ui/test-results/
