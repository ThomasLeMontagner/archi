[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "archi-explorer"
version = "0.1.0"
description = "Static architecture analysis and dependency checks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
archi = "archi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.archi]
exclude = ["tests/fixtures"]
