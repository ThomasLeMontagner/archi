[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "archi-explorer"
version = "0.2.0"
description = "Static architecture analysis and dependency checks"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
archi = "archi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archi = ["static/*"]

[tool.archi]
exclude = ["tests/fixtures"]
